	<div id="maintenanceTag" class="maintenanceTag hide-i">Maintenance Mode</div>

				The map is getting an update!<br>
				We'll be back soon.
			</p>
		</span>

  <header class="header-container hide-i">
    <div class="header-pos-container">
			<div class="header-hopt-container">
				<h2 class="header northern-bg">Map of the North</h2> <!-- SOTN2 Interactive Map -->
				<div id="info-popap-container" class="info-popap-container"></div>
			</div>
			<div id="auth-hfilter-container"  class="auth-hfilter-container open">
				<div id="auth-container" class="auth">
					<button id="login-button" class="btn-login">Login</button>
					<span id="username-display" class="username"></span>
					<div id="user-container" class="user-container"> 
						<img id="auth-img" class="auth-img action-img no-drag" src="/assets/othersvg/account_white.svg"></img>
						<img id="user-menu" class="user-menu action-img no-drag" src="/assets/othersvg/opt.svg"></img>
					</div>
				</div>
			</div>
		</div>
  </header>
  <div id="-indicators" class="svg-indicators" style="display: none;">
    <svg xmlns="http://www.w3.org/2000/svg" id="--or" class="indicator indicator--or" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13" fill="#fff" fill-opacity="0" stroke-width="6" stroke="#ffd700" display="inline"/>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" id="--exclude" class="indicator indicator--exclude" viewBox="0 0 32 32">
      <line x1="0" y1="16" x2="32" y2="16" stroke-width="6" stroke="#ffa0a0" display="inline"/>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" id="--and" class="indicator indicator--and" viewBox="0 0 32 32">
      <line x1="0" y1="16" x2="32" y2="16" stroke-width="6" stroke="#00ff7f" display="inline"/>
      <line x1="16" y1="0" x2="16" y2="32" stroke-width="6" stroke="#00ff7f" display="inline"/>
    </svg>
  </div>
  <div id="met-controls" class="met hide-i">
    <div class="met-controls-container">
	  <h3 class="optheader">MET Controllers</h3>
	  <div class="met-button-container">
	    <button id="activate-met" class="btn-met btn-start">Activate MET</button>
	    <button id="exit-met" class="btn-met btn-exit" disabled>Exit MET</button>
	    <button id="add-marker" class="btn-met btn-add" disabled>Add Marker</button>
        <button id="save-changes" class="btn-met btn-save" disabled>Save Changes</button>
	  </div>
	</div>
  </div>
  <main class="map-container">
    <aside id="map-controls" class="controls hide-i">
      <section id="options-container" class="options-container transition">
				<div class="optionheader">
					<h3 class="optheader">Options</h3>
					<button id="option-hide" class="btn-hide option-hide">
						<span id="option-hide-text" class="option-hide-text">Hide</span>
						<img id="option-hide-img" class="option-hide-img" src="/assets/othersvg/opt.svg">
					</button>
				</div>
				<div class="optparam">
					<label class="option-parameter cursor-toggle">
						<input type="checkbox" class="toggle-cursor-checkbox" id="toggle-cursor" checked>
						<span class="toggle-text toggle-cursor-text">Custom Cursor</span>
					</label>
					<label class="option-parameter regions-toggle">
						<input type="checkbox" class="toggle-regions-checkbox" id="toggle-regions">
						<span class="toggle-text toggle-regions-text">Colored Regions</span>
					</label>
					<label class="option-parameter height-toggle">
						<input type="checkbox" class="toggle-height-checkbox" id="toggle-height">
						<span class="toggle-text toggle-height-text">Height Display</span>
					</label>
					<label class="option-parameter color-toggle">
						<input type="checkbox" class="toggle-color-checkbox" id="toggle-color" checked>
						<span class="toggle-text toggle-color-text">Colored Markers</span>
					</label>
					<label class="option-parameter customcolor-toggle">
						<input type="checkbox" class="toggle-customcolor-checkbox" id="toggle-customcolor">
						<span class="toggle-text toggle-customcolor-text">Custom Colors</span>
					</label>
					<label class="option-parameter instantf-toggle">
						<input type="checkbox" class="toggle-instantf-checkbox" id="toggle-instantf" checked>
						<span class="toggle-text toggle-instantf-text">Instant Filter</span>
					</label>
				</div>
      </section>

      <section id="devlog-widget-container" class="widget-container">
      </section>
			
			<section id="filter-container" class="filter-container transition">
				<div id="filterheader" class="filterheader ftransition">
					<h3 class="filheader transition">Filters</h3>
					<button id="filter-reset" class="btn-reset transition">Clear</button>
					<button id="filter-hide" class="btn-hide filter-hide transition">
						<span id="filter-hide-text" class="filter-hide-text">Hide</span>
						<img id="filter-hide-img" class="filter-hide-img" src="/assets/othersvg/filter.svg">
					</button>
				</div>
				<div id="filter-sections" class="filter-sections">
					<section class="filter-section filter-underground" data-filter="underground">
						<div class="filter-body underground-switch">
							<label id="underground" class="underground"><input type="checkbox" value="underground"> Underground</label>
						</div>
					</section>

					<section class="filter-section filter-collected" data-filter="collected">
						<div class="filter-body collected-switch">
							<label id="collected" class="collected"><input type="checkbox" value="collected"> Collected</label>
						</div>
					</section>
					<section class="filter-section filter-icon" data-filter="icon"></section>
					<section class="filter-section filter-region" data-filter="region"></section>
					<div id="filter-sections-footer" class="filter-sections-footer"> </div>
				</div>

			</section>
		</aside>
    <div id="map" class="map-style"></div>
  </main>
  <footer class="footer-container hide-i">
    <span class="footer-text">You can support me here: </span>
  </footer>
	<template id="marker-form-template" class="hide-i">
		<form class="marker-form">
			<!-- Основная информация -->
			<fieldset class="form-section">
				<legend>Marker information</legend>

				<label class="form-field">
					<span class="form-field__label">Title</span>
					<input type="text" name="title" placeholder="Name_PlaceHolder" required>
				</label>

				<label class="form-field">
					<span class="form-field__label">Description</span>
					<textarea name="description" maxlength="600" placeholder="Description_PlaceHolder" rows="5"></textarea>
				</label>
			</fieldset>
			<!-- UAID -->
			<details class="form-section form-collapsible">
				<summary class="form-collapsible__summary">
					<span>UAID</span> <img class="form-collapsible__icon" src="/assets/othersvg/edit_white.svg" alt="">
				</summary>

				<div class="form-collapsible__content">
					<label class="form-field">
						<span class="form-field__label">UAID</span>
						<input type="text" name="uaid" minlength="34" maxlength="34" placeholder="None">
					</label>
				</div>
			</details>

			<!-- Внешний вид -->
			<fieldset class="form-section">
				<legend>Appearance</legend>

				<label class="form-field form-field--inline">
					<span class="form-field__label">Icon</span>
					<select name="icon" required>
						<option value="" selected disabled>Select icon</option>
					</select>
				</label>

				<div class="form-field">
					<span class="form-field__label">Color</span>
					<div class="color-picker" role="button" tabindex="0" aria-label="Select marker color"></div>
					<input type="hidden" name="color" class="color-input">
				</div>
			</fieldset>

			<!-- Расположение -->
			<fieldset class="form-section">
				<legend>Location</legend>
				<label class="form-field form-field--inline">
					<span class="form-field__label">Region</span>
					<select name="region">
						<option value="auto" selected>Auto</option>
						<option value="fox_island">Fox Island</option>
						<option value="misthaven">Misthaven</option>
						<option value="mosswood">Mosswood</option>
						<option value="stormvale">Stormvale</option>
						<option value="frigid_peaks">Frigid Peaks</option>
						<option value="ashlands">Ashlands</option>
						<option value="ocean">Ocean</option>
					</select>
				</label>

				<label class="checkbox-field">
					<input type="checkbox" name="underground">
					<span>Underground</span>
				</label>

				<div class="coordinate-fields">
					<label class="form-field">
						<span class="form-field__label">X</span>
						<input type="number" name="lng" step="any" required>
					</label>

					<label class="form-field">
						<span class="form-field__label">Y</span>
						<input type="number" name="lat" step="any" required>
					</label>
				</div>
			</fieldset>

			<!-- Содержимое маркера -->
			<details class="form-section form-collapsible">
				<summary class="form-collapsible__summary">
					<span>Content</span>
					<img class="form-collapsible__icon" src="/assets/othersvg/edit_white.svg" alt="">
				</summary>

				<fieldset class="content-fields">
					<legend class="visually-hidden">Marker content</legend>

					<!-- Wealth -->
					<fieldset class="form-subsection content-wealth">
						<legend>Wealth</legend>

						<label class="form-field form-field--inline">
							<span class="form-field__label">Preset</span>

							<select name="content.wealth.presetId">
								<option value="" selected>None</option>
								<option value="common">Common</option>
								<option value="uncommon">Uncommon</option>
								<option value="rare">Rare</option>
								<option value="turtle">Turtle</option>
							</select>
						</label>

						<div class="wealth-preview" hidden>
							<span>G: <output data-wealth="G">0</output></span>
							<span>B: <output data-wealth="B">0</output></span>
							<span>P: <output data-wealth="P">0</output></span>
						</div>
					</fieldset>


					<!-- Runes -->
					<fieldset class="form-subsection content-runes">
						<legend>Runes</legend>

						<div class="tag-input ordered-tag-input" data-tag-type="runes">
							<div class="tag-list" data-tag-list></div>

							<div class="tag-input__control">
								<input
									type="text"
									class="tag-input__input"
									placeholder="Add rune..."
									autocomplete="off"
									aria-label="Add rune"
								>

								<div
									class="tag-input__suggestions"
									role="listbox"
									hidden
								></div>
							</div>
						</div>

						<label class="checkbox-field">
							<input type="checkbox" name="content.runes.dropAll">
							<span>Drop all runes</span>
						</label>
					</fieldset>


					<!-- Cosmetics -->
					<fieldset class="form-subsection content-cosmetics">
						<legend>Cosmetics</legend>

						<div class="tag-input ordered-tag-input" data-tag-type="cosmetics">
							<div class="tag-list" data-tag-list></div>

							<div class="tag-input__control">
								<input
									type="text"
									class="tag-input__input"
									placeholder="Add cosmetic..."
									autocomplete="off"
									aria-label="Add cosmetic"
								>

								<div
									class="tag-input__suggestions"
									role="listbox"
									hidden
								></div>
							</div>
						</div>

						<label class="checkbox-field">
							<input type="checkbox" name="content.cosmetics.dropAll">
							<span>Drop all cosmetics</span>
						</label>

						<label class="form-field form-field--inline">
							<span class="form-field__label">Drop probability</span>

							<div class="number-field number-field--percent">
								<input
									type="number"
									name="content.cosmetics.dropProbability"
									min="0"
									max="100"
									step="0.01"
									inputmode="decimal"
								>
								<span>%</span>
							</div>
						</label>
					</fieldset>


					<!-- Melody -->
					<fieldset class="form-subsection content-melody">
						<legend>Melody</legend>

						<div class="radio-group">
							<label class="radio-field">
								<input
									type="radio"
									name="content.melody.mode"
									value="none"
									checked
								>
								<span>None</span>
							</label>

							<label class="radio-field">
								<input
									type="radio"
									name="content.melody.mode"
									value="specific"
								>
								<span>Specific</span>
							</label>

							<label class="radio-field">
								<input
									type="radio"
									name="content.melody.mode"
									value="any"
								>
								<span>Any melody</span>
							</label>
						</div>

						<div
							class="autocomplete"
							data-melody-specific
							hidden
						>
							<input
								type="text"
								class="autocomplete__input"
								placeholder="Select melody..."
								autocomplete="off"
								aria-label="Select melody"
							>

							<div
								class="autocomplete__suggestions"
								role="listbox"
								hidden
							></div>
						</div>
					</fieldset>


					<!-- Skill point -->
					<fieldset class="form-subsection content-skill">
						<legend>Skill</legend>

						<label class="checkbox-field">
							<input type="checkbox" name="content.skill">
							<span>Skill Point</span>
						</label>
					</fieldset>
				</fieldset>
			</details>

			<!-- Действия -->
			<div class="form-actions">
				<button type="submit" class="btn-submit" data-action="save">Save</button>
				<button type="button" class="btn-discard" data-action="discard">Discard</button>
				<button type="button" class="btn-delete hide" data-action="delete">Delete</button>
			</div>
		</form>
	</template>

  <div id="custom-cursor" class="cursor-base hide-i">
		<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" class="custom-cursor-svg">
			<defs>
			<clipPath id="clipTimer">
				<path d="M26,26 L26,0 A24,24 0 0,1 52,26 Z" fill="#FFFFFF"/>
			</clipPath>
			<mask id="timerMask">
				<circle id="timerProgressCircle" cx="26" cy="26" r="24" stroke="white" fill="none" stroke-width="48" stroke-dasharray="150" stroke-dashoffset="0">
				</circle>
			</mask>
			<clipPath id="clipL1">
				<circle cx="26" cy="26" r="24"/>
			</clipPath>
			<filter id="layerBlur80" x="-400%" y="-400%" width="900%" height="900%">
				<feGaussianBlur stdDeviation="8"/>
			</filter>
			<filter id="layerBlur60" x="-400%" y="-400%" width="900%" height="900%">
				<feGaussianBlur stdDeviation="6"/>
			</filter>
			<filter id="layerBlur40" x="-50%" y="-50%" width="200%" height="200%">
				<feGaussianBlur stdDeviation="4"/>
			</filter>
			<filter id="layerBlur20" x="-200%" y="-200%" width="500%" height="500%">
				<feGaussianBlur stdDeviation="2"/>
			</filter>
			<filter id="layerBlur14" x="-400%" y="-400%" width="900%" height="900%">
				<feGaussianBlur stdDeviation="1.4"/>
			</filter>
			<filter id="layerBlur10" x="-200%" y="-200%" width="500%" height="500%">
				<feGaussianBlur stdDeviation="1"/>
			</filter>
			<filter id="layerBlur06" x="-400%" y="-400%" width="900%" height="900%">
				<feGaussianBlur stdDeviation="0.6"/>
			</filter>
			</defs>
			<g id="Cursor" class="CursorStack">
				<g id="base" class="baseStack" style="mix-blend-mode: color;"> <!-- style="mix-blend-mode: none;  -->
				<g id="scaleSup" class="baseScaleAnchor">
					<circle class="base_anim_borderCircle" cx="26" cy="26" r="24" fill="none" stroke="#D9D9D9" stroke-opacity="0.85" stroke-width="6" filter="url(#layerBlur40)" clip-path="url(#clipL1)"/>
					<!-- from class="base_anim_borderCircle" to stroke-width="4" filter="url(#layerBlur14)"  -->
					<circle class="base_anim_innerCircle1" cx="26" cy="26" r="24" fill="#D9D9D9" fill-opacity="0.4" filter="url(#layerBlur06)"/>
					<!-- noanim  -->
					<circle class="base_anim_innerCircle2" cx="26" cy="26" r="2" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" filter="url(#layerBlur20)"/>
					<!-- from class="base_anim_innerCircle" to r="12" stroke-width="1" filter="url(#layerBlur10)"  -->
					<circle class="base_anim_centerCircle" cx="26" cy="26" r="1" fill="none" stroke="#FFFFFF" stroke-opacity="1" stroke-width="2" filter="url(#layerBlur10)"/>
					<!-- noanim  -->
					<g id="pointArrayToHover" class="hoverAnimPointArray"> <!-- transform: rotate Ndeg -->
						<circle class="Point5" cx="26" cy="43" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point5" cx="26" cy="43" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
						<circle class="Point3" cx="43" cy="26" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point3" cx="43" cy="26" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
						<circle class="Point7" cx="9" cy="26" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point7" cx="9" cy="26" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
						<circle class="Point1" cx="26" cy="9" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point1" cx="26" cy="9" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
						<circle class="Point4" cx="38" cy="38" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point4" cx="38" cy="38" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
						<circle class="Point8" cx="14" cy="14" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point8" cx="14" cy="14" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
						<circle class="Point2" cx="38" cy="14" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point2" cx="38" cy="14" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
						<circle class="Point6" cx="14" cy="38" r="2" fill="#D9D9D9" fill-opacity="0.2" filter="url(#layerBlur14)"/>
						<circle class="Point6" cx="14" cy="38" r="1" fill="#D9D9D9" fill-opacity="1" filter="url(#layerBlur06)"/>
					</g>
				</g>
				</g>
				<g id="Timer" class="TimerEffect" mask="url(#timerMask)" > <!-- clip-path="url(#clipTimer)" -->
					<g id="TimerBlue" class="TimerBlueEffect">
						<circle class="base_anim_borderCircle" cx="26" cy="26" r="24" fill="none" stroke="#00897a" stroke-opacity="0.85" stroke-width="6" filter="url(#layerBlur40)" clip-path="url(#clipL1)"/>
						<circle class="base_anim_innerCircle1" cx="26" cy="26" r="24" fill="#067F72" fill-opacity="0.4" filter="url(#layerBlur06)"/>
